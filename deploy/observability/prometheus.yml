# Prometheus para WebAssistant (CG-13.3). En Kubernetes se usa ServiceMonitor (deploy/k8s).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: webassistant-api
    metrics_path: /metrics
    # Si se define WEBASSISTANT_METRICS_TOKEN, añade:
    # authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics-token }
    static_configs:
      - targets: ["api:8000"]
  - job_name: webassistant-worker
    static_configs:
      - targets: ["worker:9100"]
