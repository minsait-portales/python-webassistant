# Arquitectura objetivo de producción (sección 12 del documento): API con réplicas en nodos
# distintos, worker separado, migraciones como Job y servicios de datos gestionados y privados
# (PostgreSQL, Redis y Qdrant se referencian por URL en el Secret; no se despliegan aquí).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: webassistant
    includeSelectors: false
resources:
  - configmap.yaml
  - serviceaccount.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - ingress.yaml
  - networkpolicy.yaml
images:
  - name: webassistant
    newName: ghcr.io/minsait-portales/python-webassistant
    newTag: 1.0.0-rc.1
