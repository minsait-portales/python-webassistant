# Solo el ingress controller llega a la API y solo la monitorización a las métricas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webassistant-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webassistant-api-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: webassistant-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8000, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webassistant-worker-metrics
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: webassistant-worker }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 9100, protocol: TCP }
