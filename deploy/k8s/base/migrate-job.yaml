# Ejecutar en cada release ANTES de actualizar API y worker (CI/CD, hook de Argo CD o Helm).
apiVersion: batch/v1
kind: Job
metadata:
  name: webassistant-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webassistant-migrate
    spec:
      serviceAccountName: webassistant
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: webassistant
          command: ["webassistant", "migrate"]
          envFrom:
            - configMapRef: { name: webassistant-config }
            - secretRef: { name: webassistant-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
