apiVersion: apps/v1
kind: Deployment
metadata:
  name: webassistant-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: webassistant-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webassistant-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: webassistant
      terminationGracePeriodSeconds: 60
      # Réplicas en nodos y zonas distintos: varias réplicas en un mismo nodo no son HA.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: webassistant-api }
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: webassistant-api }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: webassistant
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: webassistant-config }
            - secretRef: { name: webassistant-secrets }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Da tiempo al balanceador a retirar la instancia antes de cerrar conexiones SSE.
            preStop:
              exec: { command: ["python", "-c", "import time; time.sleep(10)"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: webassistant-api
  labels:
    app.kubernetes.io/name: webassistant-api
spec:
  selector:
    app.kubernetes.io/name: webassistant-api
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webassistant-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: webassistant-api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webassistant-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webassistant-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
