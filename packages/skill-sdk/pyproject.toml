[project]
name = "webassistant-skill-sdk"
version = "1.0.0rc1"
description = "SDK para crear skills portables de WebAssistant sin modificar el núcleo."
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
  "jsonschema>=4.23",
]

[project.scripts]
webassistant-skill = "webassistant_skill_sdk.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webassistant_skill_sdk"]
