[project]
name = "webassistant-api"
version = "1.0.0rc1"
description = "WebAssistant AI: API pública, orquestador, skills, RAG y administración."
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "redis>=5.2",
  "qdrant-client>=1.12",
  "openai>=1.55",
  "httpx>=0.27",
  "pyjwt>=2.10",
  "cryptography>=43",
  "jsonschema>=4.23",
  "pyyaml>=6.0.2",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "arq>=0.26",
  "typer>=0.13",
  "webassistant-skill-sdk",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
  "opentelemetry-instrumentation-redis>=0.66b1",
  "opentelemetry-instrumentation-httpx>=0.66b1",
]

[project.scripts]
webassistant = "webassistant.cli:app"

[project.entry-points."webassistant.skills"]
builtin = "webassistant.builtin_skills:skill_paths"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webassistant"]

[tool.hatch.build.targets.wheel.force-include]
"../../packages/contracts/schemas" = "webassistant/_contracts/schemas"

[tool.uv.sources]
webassistant-skill-sdk = { workspace = true }
