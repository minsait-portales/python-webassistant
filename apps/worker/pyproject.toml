[project]
name = "webassistant-worker"
version = "1.0.0rc1"
description = "WebAssistant AI: worker asíncrono (ingesta RAG, reindexado, retención y conciliación)."
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
  "webassistant-api",
  "arq>=0.26",
]

[project.scripts]
webassistant-worker = "webassistant_worker.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webassistant_worker"]

[tool.uv.sources]
webassistant-api = { workspace = true }
