[project]
name = "webassistant-monorepo"
version = "1.0.0rc1"
description = "WebAssistant AI: capa genérica (API, worker, widget y consola)."
requires-python = ">=3.12,<3.14"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/skill-sdk"]

[tool.uv.sources]
webassistant-api = { workspace = true }
webassistant-worker = { workspace = true }
webassistant-skill-sdk = { workspace = true }

[dependency-groups]
dev = [
  "webassistant-api",
  "webassistant-worker",
  "webassistant-skill-sdk",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "fakeredis>=2.26",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "types-jsonschema",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/widget", "apps/admin", "packages/sdk-js", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PL", "N", "C4", "PIE", "PT", "RET", "TID"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415",
  "S101", "RUF001", "RUF002", "RUF003", "B008", "S105", "S106",
  "PLW0603", "RET504", "SIM108", "PLC1901",
  "E501",      # el formateador gestiona el código; se permiten cadenas largas (prompts, mensajes)
  "PLR0917",   # servicios con dependencias explícitas por constructor
  "UP046", "UP047", "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR", "ARG", "N802", "PT011", "B017", "PT018", "PT022", "RUF059"]
"apps/api/migrations/**" = ["E501", "N"]

[tool.ruff.lint.isort]
known-first-party = ["webassistant", "webassistant_worker", "webassistant_skill_sdk"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api/src", "apps/worker/src", "packages/skill-sdk/src"]
packages = ["webassistant", "webassistant_worker", "webassistant_skill_sdk"]
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = ["webassistant.db.models"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/skill-sdk/tests"]
markers = [
  "postgres: requiere PostgreSQL real (WEBASSISTANT_TEST_DATABASE_URL)",
  "slow: pruebas lentas (carga, evaluación)",
]
filterwarnings = [
  "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
  "ignore::DeprecationWarning:qdrant_client.*",
]

[tool.coverage.run]
source = ["webassistant", "webassistant_worker"]
omit = ["*/migrations/*"]

[tool.bandit]
exclude_dirs = ["tests", "apps/widget", "apps/admin", "node_modules"]
skips = ["B101"]
